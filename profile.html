<!-- profile.html (Work Report System\profile.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Work Report System</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="buttons.css">
    <link rel="stylesheet" href="forms.css">
    <link rel="stylesheet" href="cards.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="utiilities.css"> <!-- matches actual filename on disk (typo: "utiilities") -->
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .profile-picture-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-picture-wrapper img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-light);
        }
        .profile-picture-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--primary-light);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 3px solid var(--primary-light);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="navbar-brand">
                <h2>Work Report System</h2>
            </div>
            <div class="navbar-menu">
                <a href="employee-dashboard.html" class="nav-link">Dashboard</a>
                <a href="my-reports.html" class="nav-link">My Reports</a>
                <a href="employee-analytics.html" class="nav-link">Analytics</a>
                <a href="profile.html" class="nav-link active">Profile</a>
                <button class="nav-link" id="logoutBtn">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h1>My Profile</h1>
                <p>Manage your account details and settings</p>
            </div>

            <!-- Profile Picture -->
            <div class="card" style="max-width: 700px; margin: 0 auto 20px; text-align: center;">
                <div class="profile-picture-wrapper">
                    <img id="profilePicturePreview" src="" alt="Profile picture" style="display:none;">
                    <div id="profilePictureIcon" class="profile-picture-icon">👤</div>
                </div>
                <button type="button" class="btn btn-secondary" id="changePictureBtn" style="margin-top: 12px;">
                    Change Picture
                </button>
                <input type="file" id="profilePictureInput" accept="image/*" hidden>
            </div>

            <!-- Profile Info -->
            <div class="card" style="max-width: 700px; margin: 0 auto 20px;">
                <h3 style="margin-bottom: 16px;">Profile Information</h3>

                <!-- Profile Info Form -->
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" required>
                        </div>
                        <div class="form-group">
                            <label for="employeeId">Employee ID</label>
                            <input type="text" id="employeeId" disabled>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" disabled>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="department">Department</label>
                            <select id="department" required>
                                <option value="engineering">Engineering</option>
                                <option value="sales">Sales</option>
                                <option value="marketing">Marketing</option>
                                <option value="hr">Human Resources</option>
                                <option value="finance">Finance</option>
                                <option value="operations">Operations</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="position">Position</label>
                            <input type="text" id="position">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Optional">
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <!-- Change Password -->
            <div class="card" style="max-width: 700px; margin: 0 auto;">
                <h3 style="margin-bottom: 16px;">Change Password</h3>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Min 8 characters" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" required>
                    </div>
                    <button type="submit" class="btn btn-secondary">Update Password</button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script src="firestore.js"></script>
    <script src="utils.js"></script>
    <script src="profile.js"></script>
</body>
</html>
